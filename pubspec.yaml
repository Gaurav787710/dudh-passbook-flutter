name: dairymaster_pro
description: "Dudh Passbook - Complete Dairy Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # Database
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  
  # State Management & Storage
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  
  # Firebase - Cloud Sync
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  
  # Date & Time
  intl: 0.20.2
  
  # Charts & Analytics
  fl_chart: ^0.69.2
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # Sharing & File Operations
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  path: ^1.9.0
  file_picker: ^8.1.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Excel Export
  excel: ^4.0.6
  
  # Google Drive Backup
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  
  # Unique ID generation
  uuid: ^4.5.1

  # Background Tasks
  workmanager: ^0.9.0+3
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2E7D32"  # Changed from #FFFFFF to matching Green theme
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_round: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/app_icon.png
    - assets/icon/splash_logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
